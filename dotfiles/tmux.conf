# ─── 按键响应 ─────────────────────────────────────────────
set -sg escape-time 10

# xterm-keys 保留（保证功能键正常），去掉 extended-keys
set -g xterm-keys on

# 终端类型（很重要，保证 TUI 应用收到正确的 key sequence）
set -g default-terminal "xterm-256color"

# ─── 鼠标模式 ─────────────────────────────────────────────
# 默认开鼠标：滚轮/手指滑动 = 翻 tmux 历史
# 电脑端复制：Shift+拖拽走 Windows Terminal 原生选择（绕过 tmux 拦截）
# 手机端复制：prefix+m 关鼠标 → 长按选文字 → 复制 → prefix+m 开回来
set -g mouse on

# prefix + m 切换鼠标开关
bind m set -g mouse \; display-message "mouse: #{?mouse,ON,OFF}"

# ─── 复制优化 ─────────────────────────────────────────────
# 鼠标拖选松手：写 Windows 剪贴板，留在 copy-mode（不自动退出，可继续滚）
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe "clip.exe"

# ─── 手机端跨屏复制（vi Copy Mode）──────────────────────
# 手机端流程：滑动进 Copy Mode → 滑动到起点 → Space 锁起点 → 滑动跨屏延伸 → Enter 复制
# 机制：Space 在光标处锁定起点，滚动移动光标使选择跨屏延伸（避开触屏拖拽到边缘失效）
# Space/Enter 是 vi 模式默认绑定，且在手机软键盘上直接可按（不需切符号页）
# 复制经 set-clipboard external（OSC 52）转发到 Termux → 手机剪贴板
setw -g mode-keys vi

# ─── 状态栏（显示完整 Session 名，不截断）──────────
# 左侧：完整 Session 名 + 当前 Window 信息
set -g status-left-length 50
set -g status-left "[#S] "

# 右侧：时间
set -g status-right-length 50
set -g status-right "%H:%M "

# Window 列表样式：名字完整显示
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W*"
